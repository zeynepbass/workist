services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-test:
    image: mongo:8
    profiles: ["test"]
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: workist
      MINIO_ROOT_PASSWORD: workist-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 workist workist-dev-secret &&
             mc mb --ignore-existing local/workist &&
             mc anonymous set download local/workist/public"

  server:
    build:
      context: ./server
      target: development
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/workist
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-me-please}
      CLIENT_URL: http://localhost:3000
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: workist
      S3_ACCESS_KEY_ID: workist
      S3_SECRET_ACCESS_KEY: workist-dev-secret
      S3_PUBLIC_URL: http://localhost:9000/workist
      S3_FORCE_PATH_STYLE: "true"
    command: sh -c "npx migrate-mongo up && npm run dev"
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  client:
    build:
      context: ./client
      target: development
    environment:
      API_PROXY_TARGET: http://server:4000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
  minio-data:
