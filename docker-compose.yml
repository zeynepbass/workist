services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-test:
    image: mongo:8
    profiles: ["test"]
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db

  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: workist
    ports:
      - "${S3_PORT:-9090}:9090"

  server:
    build:
      context: ./server
      target: development
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/workist
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-me-please}
      CLIENT_URL: http://localhost:${CLIENT_PORT:-3000}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:9090
      S3_REGION: us-east-1
      S3_BUCKET: workist
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: local-secret
      S3_PUBLIC_URL: http://localhost:${S3_PORT:-9090}/workist
      S3_FORCE_PATH_STYLE: "true"
    command: sh -c "npx migrate-mongo up && npm run dev"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      s3:
        condition: service_started

  client:
    build:
      context: ./client
      target: development
    environment:
      API_PROXY_TARGET: http://server:4000
      WATCHPACK_POLLING: "true"
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
